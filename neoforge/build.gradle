plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    compileOnly "io.github.llamalad7:mixinextras-common:0.5.0"

    if (rootProject.obfuscated) {
        common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    } else {
        common(project(path: ':common')) { transitive false }
    }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    def tokens = [
        version: project.version,
        neoforge_range: rootProject.neoforge_range,
        neoforge_minecraft_range: rootProject.neoforge_minecraft_range
    ]
    inputs.properties tokens

    filesMatching('META-INF/neoforge.mods.toml') {
        expand tokens
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // NeoForge runs on Mojang names and draws the HUD in its own layer methods:
    // no Fabric refmap, Fabric mixin config or vanilla HUD hooks.
    exclude 'rpglocatorbar-refmap.json'
    exclude 'rpglocatorbar.mixins.json'
    exclude 'yeah/im/liam/rpglocatorbar/mixin/*/GuiMixin.class'
    exclude 'yeah/im/liam/rpglocatorbar/mixin/*/HudMixin.class'
}

if (rootProject.obfuscated) {
    shadowJar {
        archiveClassifier = 'dev-shadow'
    }
    remapJar {
        input.set shadowJar.archiveFile
    }
    loom {
        mixin {
            useLegacyMixinAp = false
        }
    }
} else {
    jar {
        archiveClassifier = 'raw'
    }
    shadowJar {
        archiveClassifier = null
    }
    assemble.dependsOn shadowJar
}
