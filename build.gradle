plugins {
    id 'dev.architectury.loom' version '1.13.463' apply false
    id 'architectury-plugin' version '3.4.162'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

def selectedVersion = findProperty('mc') ?: rootProject.minecraft_version
def versionFile = file("versions/${selectedVersion}.properties")
if (!versionFile.exists()) {
    throw new GradleException("Unknown Minecraft version ${selectedVersion}: missing ${versionFile}")
}
def versionProperties = new Properties()
versionFile.withInputStream { versionProperties.load(it) }
versionProperties.each { key, value -> rootProject.ext.set(key.toString(), value.toString()) }

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "$rootProject.archives_name-$project.name-mc$rootProject.minecraft_version"
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    // Classes whose Minecraft API differs between versions live in src/compat/<name>/java.
    sourceSets.main.java.srcDir "src/compat/${rootProject.compat}/java"

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    loom {
        mixin {
            useLegacyMixinAp = true
            defaultRefmapName.set("rpglocatorbar-refmap.json")
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
        }
    }
}
